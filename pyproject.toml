[project]
name = "hearthbeat"
version = "0.1.0"
description = "Autonomous household-operations agent: a Cloud Scheduler-fired ADK pipeline that runs a family home's morning — no chat UI."
authors = [
    {name = "DZim89", email = "223544382+DZim89@users.noreply.github.com"},
]

dependencies = [
    "google-adk[gcp]>=2.6.0,<3.0.0",
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn~=0.34.0",
    "google-cloud-firestore>=2.19,<3.0.0",
    "google-cloud-pubsub>=2.23,<3.0.0",
    "litellm>=1.60",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "house"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app", "house"]
